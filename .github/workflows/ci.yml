name: RailHelpAI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Initialize Database & Seed Demo Scenarios
        run: |
          python app/database/init_db.py
          python scripts/seed_demo_data.py

      - name: Run Python Compileall Check
        run: python -m compileall app

      - name: Run Page Import Smoke Tests
        run: python scripts/test_page_imports.py

      - name: Run Streamlit AppTest UI Suite
        run: pytest tests/test_streamlit_app.py -v

      - name: Run Complete Pytest Suite
        run: pytest tests/ -v

      - name: Verify Git Diff Whitespace Compliance
        run: git diff --check
